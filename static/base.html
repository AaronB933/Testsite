<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50:  #EAF3DE;
      --green-100: #C0DD97;
      --green-200: #97C459;
      --green-600: #3B6D11;
      --green-800: #27500A;
      --green-900: #173404;
      --amber-50:  #FAEEDA;
      --amber-400: #BA7517;
      --gray-50:   #F1EFE8;
      --gray-100:  #D3D1C7;
      --gray-200:  #B4B2A9;
      --gray-600:  #5F5E5A;
      --gray-800:  #444441;
      --season-spring: #7CB87A;
      --season-summer: #E8A838;
      --season-fall:   #C45E2A;
      --season-winter: #5B8BB0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f5f0;
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--green-900);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      height: 60px;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--green-50);
      margin-right: 2rem;
      white-space: nowrap;
    }

    nav .nav-links {
      display: flex;
      gap: 0.25rem;
      flex: 1;
    }

    nav a {
      color: rgba(234,243,222,0.6);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }

    nav a:hover { background: rgba(255,255,255,0.08); color: var(--green-50); }
    nav a.active { background: rgba(255,255,255,0.12); color: var(--green-50); }

    nav .user-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-left: auto;
    }

    nav .username {
      font-size: 0.8rem;
      color: rgba(234,243,222,0.5);
    }

    nav .logout-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--green-50);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    nav .logout-btn:hover { background: rgba(255,255,255,0.18); }

    /* ── Page content wrapper ── */
    .page { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 2rem; right: 2rem;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
      max-width: 340px;
      background: var(--green-800);
      color: var(--green-50);
    }
    #toast.show          { opacity: 1; transform: translateY(0); }
    #toast.toast-error   { background: #A32D2D; }
    #toast.toast-warn    { background: var(--amber-400); }
    #toast.toast-info    { background: var(--green-600); }

    /* ── Spinner overlay ── */
    #spinner-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(23,52,4,0.3);
      z-index: 500;
      align-items: center; justify-content: center;
    }
    #spinner-overlay.show { display: flex; }
    .spinner-box {
      background: white; border-radius: 16px;
      padding: 2rem 2.5rem; text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1rem; color: var(--green-800);
    }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--green-100);
      border-top-color: var(--green-600);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Shared card style ── */
    .card {
      background: white;
      border: 1px solid var(--gray-100);
      border-radius: 14px;
      padding: 1.5rem;
    }

    /* ── Shared section title ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 1.25rem;
    }

    /* ── Photo grid shared ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.85rem;
    }

    .photo-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--gray-100);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .photo-card:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(23,52,4,0.1); }
    .photo-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .photo-card .info { padding: 0.5rem 0.65rem; }
    .photo-card .p-date { font-size: 0.78rem; font-weight: 500; color: var(--green-800); }
    .photo-card .p-label { font-size: 0.7rem; color: var(--gray-200); margin-top: 2px; }

    /* selectable checkbox */
    .photo-card .select-cb {
      position: absolute;
      top: 6px; left: 6px;
      width: 20px; height: 20px;
      accent-color: var(--green-600);
      cursor: pointer;
      display: none;
    }
    .select-mode .photo-card .select-cb { display: block; }
    .photo-card.selected { outline: 2px solid var(--green-600); }

    /* season badge */
    .season-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 3px;
      text-transform: capitalize;
    }
    .badge-spring { background: #D4EDD3; color: #2D6B2B; }
    .badge-summer { background: #FDE9BF; color: #7A4F0A; }
    .badge-fall   { background: #F5D5C5; color: #7A2A0A; }
    .badge-winter { background: #D0E4F5; color: #1A4A6E; }

    /* empty state */
    .empty-state { text-align: center; padding: 3.5rem 2rem; color: var(--gray-200); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.875rem; }
  </style>
</head>
<body>

<nav id="main-nav">
  <span class="brand">🌿 Plant Archive</span>
  <div class="nav-links">
    <a href="/" id="nav-home">Home</a>
    <a href="/upload" id="nav-upload">Upload Photos</a>
    <a href="/organize" id="nav-organize">Organize Photos</a>
  </div>
  <div class="user-area">
    <span class="username" id="nav-username"></span>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
</nav>

<div id="toast"></div>
<div id="spinner-overlay"><div class="spinner-box"><div class="spinner"></div>Working...</div></div>

<script>
  // ── Nav active state ──────────────────────────────────────────────────────
  (function() {
    const path = window.location.pathname;
    if (path === '/' || path === '/home') document.getElementById('nav-home').classList.add('active');
    else if (path === '/upload') document.getElementById('nav-upload').classList.add('active');
    else if (path === '/organize') document.getElementById('nav-organize').classList.add('active');
  })();

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function initNav() {
    const res = await fetch('/api/me');
    if (res.status === 401) { window.location.href = '/'; return false; }
    const user = await res.json();
    window._userId = user.id;
    window._username = user.username;
    document.getElementById('nav-username').textContent = user.username;
    return true;
  }

  async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show toast-${type}`;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = '', 3500);
  }

  // ── Spinner ───────────────────────────────────────────────────────────────
  function showSpinner(msg = 'Working...') {
    document.querySelector('.spinner-box').childNodes[1].textContent = msg;
    document.getElementById('spinner-overlay').classList.add('show');
  }
  function hideSpinner() {
    document.getElementById('spinner-overlay').classList.remove('show');
  }

  // ── Shared photo img src helper ───────────────────────────────────────────
  function photoSrc(photo) {
    return `/uploads/user_${window._userId}/inbox/${photo.stored_filename}`;
  }

  // ── Date formatter ────────────────────────────────────────────────────────
  function fmtDate(d) {
    if (!d) return 'Unknown date';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US',
      { month: 'short', day: 'numeric', year: 'numeric' });
  }
</script>
</body>
</html>
