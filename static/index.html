<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #EAF3DE;
      --green-100: #C0DD97;
      --green-200: #97C459;
      --green-600: #3B6D11;
      --green-800: #27500A;
      --green-900: #173404;
      --amber-50: #FAEEDA;
      --amber-400: #BA7517;
      --gray-50: #F1EFE8;
      --gray-100: #D3D1C7;
      --gray-200: #B4B2A9;
      --gray-600: #5F5E5A;
      --gray-800: #444441;
      --teal-50: #E1F5EE;
      --teal-600: #0F6E56;
      --teal-800: #085041;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f5f0;
      color: var(--gray-800);
      min-height: 100vh;
    }

    header {
      background: var(--green-900);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--green-50);
      letter-spacing: 0.02em;
    }

    header .leaf {
      font-size: 1.4rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 68px);
    }

    /* Sidebar */
    .sidebar {
      background: white;
      border-right: 1px solid var(--gray-100);
      padding: 1.5rem 1rem;
    }

    .sidebar h2 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-200);
      padding: 0 0.5rem;
      margin-bottom: 0.75rem;
    }

    .plant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.9rem;
    }

    .plant-item:hover { background: var(--green-50); }
    .plant-item.active { background: var(--green-50); color: var(--green-800); font-weight: 500; }

    .plant-item .count {
      font-size: 0.75rem;
      color: var(--gray-200);
      background: var(--gray-50);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .plant-item.active .count {
      background: var(--green-100);
      color: var(--green-800);
    }

    .all-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      background: none;
      border: none;
      color: var(--gray-800);
      font-family: inherit;
      margin-bottom: 0.5rem;
      transition: background 0.15s;
    }
    .all-btn:hover { background: var(--gray-50); }
    .all-btn.active { background: var(--green-50); color: var(--green-800); }

    /* Main content */
    .main {
      padding: 2rem;
    }

    /* Upload zone */
    .upload-section {
      background: white;
      border: 2px dashed var(--green-100);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }

    .upload-section.dragover {
      border-color: var(--green-600);
      background: var(--green-50);
    }

    .upload-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    .upload-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--green-800);
      margin-bottom: 0.4rem;
    }

    .upload-section p {
      font-size: 0.85rem;
      color: var(--gray-200);
      margin-bottom: 1.25rem;
    }

    .upload-controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
    }

    .upload-controls input[type="text"],
    .upload-controls input[type="date"] {
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--gray-100);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--gray-800);
      background: var(--gray-50);
      outline: none;
      transition: border-color 0.15s;
    }

    .upload-controls input:focus { border-color: var(--green-200); background: white; }

    .upload-controls label.btn {
      padding: 0.5rem 1.25rem;
      background: var(--green-800);
      color: var(--green-50);
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .upload-controls label.btn:hover { background: var(--green-900); }
    #file-input { display: none; }

    /* Date missing warning */
    .date-warning {
      display: none;
      background: var(--amber-50);
      border: 1px solid #EF9F27;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--amber-400);
      margin-top: 0.75rem;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--green-800);
      color: var(--green-50);
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 100;
      max-width: 320px;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: #A32D2D; }

    /* Photo grid */
    .grid-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .grid-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
      text-transform: capitalize;
    }

    .grid-header .meta {
      font-size: 0.8rem;
      color: var(--gray-200);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .photo-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--gray-100);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .photo-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(23, 52, 4, 0.1);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .photo-card .photo-info {
      padding: 0.6rem 0.75rem;
    }

    .photo-card .photo-date {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--green-800);
    }

    .photo-card .photo-plant {
      font-size: 0.75rem;
      color: var(--gray-200);
      text-transform: capitalize;
      margin-top: 2px;
    }

    .no-exif-badge {
      display: inline-block;
      font-size: 0.65rem;
      background: var(--amber-50);
      color: var(--amber-400);
      border-radius: 4px;
      padding: 1px 6px;
      margin-top: 3px;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-200);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.95rem; }

    /* Upload progress */
    .uploading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(23,52,4,0.35);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .uploading-overlay.show { display: flex; }

    .uploading-box {
      background: white;
      border-radius: 16px;
      padding: 2rem 2.5rem;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--green-800);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--green-100);
      border-top-color: var(--green-600);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:0.75rem;">
    <span class="leaf">🌿</span>
    <h1>Plant Archive</h1>
  </div>
  <div style="display:flex;align-items:center;gap:0.75rem;">
    <span id="username-display" style="font-size:0.8rem;color:rgba(234,243,222,0.6);"></span>
    <button onclick="doLogout()" style="background:rgba(255,255,255,0.12);border:none;color:#EAF3DE;padding:0.35rem 0.85rem;border-radius:8px;font-family:inherit;font-size:0.8rem;cursor:pointer;">Sign out</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Collections</h2>
    <button class="all-btn active" onclick="loadAll(this)">
      All plants <span id="total-count" class="count">0</span>
    </button>
    <div id="plant-list"></div>
  </aside>

  <main class="main">
    <!-- Upload zone -->
    <div class="upload-section" id="drop-zone">
      <div class="upload-icon">📷</div>
      <h3>Drop photos here</h3>
      <p>Drag & drop or browse — JPEG, HEIC, PNG supported</p>
      <div class="upload-controls">
        <input type="text" id="plant-input" placeholder="Plant name (e.g. rose)" />
        <input type="date" id="manual-date" title="Only needed if photo has no EXIF date" />
        <label class="btn" for="file-input">Browse files</label>
        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.heic,.heif,.tiff" />
      </div>
      <div class="date-warning" id="date-warning">
        ⚠ No EXIF date found in one or more photos. Please set the date above before uploading.
      </div>
    </div>

    <!-- Gallery -->
    <div class="grid-header">
      <h2 id="gallery-title">All plants</h2>
      <span class="meta" id="gallery-meta"></span>
    </div>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="empty-state" id="empty-state">
      <div class="icon">🌱</div>
      <p>No photos yet — drop some in above</p>
    </div>
  </main>
</div>

<!-- Upload spinner -->
<div class="uploading-overlay" id="uploading-overlay">
  <div class="uploading-box">
    <div class="spinner"></div>
    Processing photos...
  </div>
</div>

<div id="toast"></div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const plantInput = document.getElementById('plant-input');
  const manualDate = document.getElementById('manual-date');
  const photoGrid = document.getElementById('photo-grid');
  const emptyState = document.getElementById('empty-state');
  const plantList = document.getElementById('plant-list');
  const galleryTitle = document.getElementById('gallery-title');
  const galleryMeta = document.getElementById('gallery-meta');
  const totalCount = document.getElementById('total-count');
  const uploadingOverlay = document.getElementById('uploading-overlay');

  let currentPlantId = null;

  // ── Drag & drop ───────────────────────────────────────────────────────────
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(Array.from(e.dataTransfer.files));
  });

  fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

  // ── Upload handler ────────────────────────────────────────────────────────
  async function handleFiles(files) {
    const plant = plantInput.value.trim();
    if (!plant) { showToast('Please enter a plant name first', true); return; }
    if (!files.length) return;

    uploadingOverlay.classList.add('show');
    let successCount = 0;
    let noDateFiles = [];

    for (const file of files) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('plant', plant);
      if (manualDate.value) formData.append('date', manualDate.value);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.status === 422 && data.error === 'no_date') {
          noDateFiles.push(file.name);
        } else if (data.success) {
          successCount++;
        } else {
          showToast(`Error: ${data.error}`, true);
        }
      } catch (err) {
        showToast('Upload failed — is the server running?', true);
      }
    }

    uploadingOverlay.classList.remove('show');

    if (noDateFiles.length) {
      document.getElementById('date-warning').style.display = 'block';
      showToast(`Set the date above and retry: ${noDateFiles.join(', ')}`, true);
    } else {
      document.getElementById('date-warning').style.display = 'none';
    }

    if (successCount) {
      showToast(`${successCount} photo${successCount > 1 ? 's' : ''} archived`);
      fileInput.value = '';
      await loadSidebar();
      if (currentPlantId) {
        loadPlantPhotos(currentPlantId, plant);
      } else {
        loadAll();
      }
    }
  }

  // ── Load sidebar plants ───────────────────────────────────────────────────
  async function loadSidebar() {
    const plants = await fetch('/api/plants').then(r => r.json());
    const total = plants.reduce((s, p) => s + p.photo_count, 0);
    totalCount.textContent = total;

    plantList.innerHTML = plants.map(p => `
      <div class="plant-item" onclick="loadPlantPhotos(${p.id}, '${p.name}', this)">
        <span>${p.name}</span>
        <span class="count">${p.photo_count}</span>
      </div>
    `).join('');
  }

  // ── Load all photos ───────────────────────────────────────────────────────
  async function loadAll(btn) {
    currentPlantId = null;
    galleryTitle.textContent = 'All plants';
    document.querySelectorAll('.plant-item').forEach(el => el.classList.remove('active'));
    document.querySelector('.all-btn').classList.add('active');

    const photos = await fetch('/api/photos').then(r => r.json());
    galleryMeta.textContent = `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
    renderPhotos(photos);
  }

  // ── Load photos for one plant ─────────────────────────────────────────────
  async function loadPlantPhotos(plantId, plantName, el) {
    currentPlantId = plantId;
    galleryTitle.textContent = plantName;
    document.querySelectorAll('.plant-item').forEach(i => i.classList.remove('active'));
    document.querySelector('.all-btn').classList.remove('active');
    if (el) el.classList.add('active');

    const photos = await fetch(`/api/plants/${plantId}/photos`).then(r => r.json());
    galleryMeta.textContent = `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
    renderPhotos(photos);
  }

  // ── Render photo grid ─────────────────────────────────────────────────────
  function renderPhotos(photos) {
    if (!photos.length) {
      photoGrid.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    photoGrid.innerHTML = photos.map(p => {
      const imgSrc = `/uploads/${p.plant_name.replace(/ /g, '_')}/${p.stored_filename}`;
      const date = p.date_taken
        ? new Date(p.date_taken + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : 'Unknown date';

      return `
        <div class="photo-card">
          <img src="${imgSrc}" alt="${p.plant_name}" loading="lazy"
               onerror="this.style.background='#EAF3DE';this.style.height='180px'">
          <div class="photo-info">
            <div class="photo-date">${date}</div>
            <div class="photo-plant">${p.plant_name}</div>
            ${!p.exif_found ? '<span class="no-exif-badge">date entered manually</span>' : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.className = '', 3500);
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function checkAuth() {
    const res = await fetch('/api/me');
    if (res.status === 401) { window.location.href = '/'; return; }
    const user = await res.json();
    document.getElementById('username-display').textContent = user.username;
  }

  async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  checkAuth();
  loadSidebar();
  loadAll();
</script>
</body>
</html>
