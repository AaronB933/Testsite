<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Plant Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --green-50: #EAF3DE;
      --green-100: #C0DD97;
      --green-600: #3B6D11;
      --green-800: #27500A;
      --green-900: #173404;
      --gray-50: #F1EFE8;
      --gray-100: #D3D1C7;
      --gray-200: #B4B2A9;
      --gray-600: #5F5E5A;
      --gray-800: #444441;
      --amber-50: #FAEEDA;
      --amber-400: #BA7517;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f5f0;
      color: var(--gray-800);
      min-height: 100vh;
      padding-bottom: 2rem;
    }
 
    /* Header */
    header {
      background: var(--green-900);
      padding: 1rem 1.25rem;
      padding-top: calc(1rem + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
 
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--green-50);
    }
 
    header .leaf { font-size: 1.2rem; }
 
    /* Plant filter tabs */
    .filter-bar {
      background: white;
      border-bottom: 1px solid var(--gray-100);
      padding: 0.75rem 1rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: sticky;
      top: 60px;
      z-index: 40;
    }
 
    .filter-bar::-webkit-scrollbar { display: none; }
 
    .filter-chip {
      flex-shrink: 0;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1.5px solid var(--gray-100);
      background: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      text-transform: capitalize;
    }
 
    .filter-chip.active {
      background: var(--green-900);
      border-color: var(--green-900);
      color: var(--green-50);
      font-weight: 500;
    }
 
    /* Photo count bar */
    .count-bar {
      padding: 0.75rem 1.25rem 0.25rem;
      font-size: 0.8rem;
      color: var(--gray-200);
    }
 
    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      padding: 0.75rem 1rem;
    }
 
    .photo-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--gray-100);
      cursor: pointer;
      transition: transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
 
    .photo-card:active { transform: scale(0.97); }
 
    .photo-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
 
    .photo-card .info {
      padding: 0.6rem 0.75rem;
    }
 
    .photo-card .date {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--green-800);
    }
 
    .photo-card .plant-name {
      font-size: 0.72rem;
      color: var(--gray-200);
      text-transform: capitalize;
      margin-top: 1px;
    }
 
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top));
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
 
    .lightbox.show { display: flex; }
 
    .lightbox-close {
      position: absolute;
      top: calc(1rem + env(safe-area-inset-top));
      right: 1.25rem;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
 
    .lightbox img {
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 10px;
    }
 
    .lightbox-meta {
      margin-top: 1rem;
      text-align: center;
    }
 
    .lightbox-meta .lb-date {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: white;
      font-weight: 400;
    }
 
    .lightbox-meta .lb-plant {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      text-transform: capitalize;
      margin-top: 3px;
    }
 
    /* Save button */
    .save-btn {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 280px;
    }
 
    .btn-save {
      width: 100%;
      padding: 0.9rem;
      background: var(--green-600);
      color: var(--green-50);
      border: none;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      text-align: center;
      display: block;
    }
 
    .btn-save:active { background: var(--green-800); }
 
    .save-hint {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
 
    /* Nav prev/next */
    .lightbox-nav {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
 
    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
 
    .nav-btn:active { background: rgba(255,255,255,0.25); }
 
    /* Empty state */
    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-200);
    }
 
    .empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty p { font-size: 0.9rem; }
 
    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--gray-200);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
 
<header>
  <h1>🌿 Plant Archive</h1>
  <span style="font-size:0.75rem; color: rgba(234,243,222,0.5);">mobile</span>
</header>
 
<div class="filter-bar" id="filter-bar">
  <button class="filter-chip active" onclick="filterPlant(null, this)">All</button>
</div>
 
<div class="count-bar" id="count-bar"></div>
 
<div class="photo-grid" id="photo-grid">
  <div class="loading">Loading photos...</div>
</div>
 
<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="" />
  <div class="lightbox-meta">
    <div class="lb-date" id="lb-date"></div>
    <div class="lb-plant" id="lb-plant"></div>
  </div>
  <div class="save-btn">
    <a id="lb-download" class="btn-save" download>⬇ Save to Camera Roll</a>
    <div class="save-hint" id="save-hint"></div>
  </div>
  <div class="lightbox-nav">
    <button class="nav-btn" onclick="navigatePhoto(-1)">&#8592;</button>
    <button class="nav-btn" onclick="navigatePhoto(1)">&#8594;</button>
  </div>
</div>
 
<script>
  let allPhotos = [];
  let filtered = [];
  let currentIndex = 0;
  let currentPlantId = null;
 
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
 
  // ── Load everything ───────────────────────────────────────────────────────
  async function init() {
    const [photos, plants] = await Promise.all([
      fetch('/api/photos').then(r => r.json()),
      fetch('/api/plants').then(r => r.json())
    ]);
 
    allPhotos = photos;
    filtered = photos;
 
    buildFilterChips(plants);
    renderGrid(photos);
  }
 
  // ── Filter chips ──────────────────────────────────────────────────────────
  function buildFilterChips(plants) {
    const bar = document.getElementById('filter-bar');
    plants.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.textContent = p.name;
      btn.onclick = () => filterPlant(p.id, btn);
      bar.appendChild(btn);
    });
  }
 
  function filterPlant(plantId, el) {
    currentPlantId = plantId;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    filtered = plantId ? allPhotos.filter(p => p.plant_id === plantId) : allPhotos;
    renderGrid(filtered);
  }
 
  // ── Render grid ───────────────────────────────────────────────────────────
  function renderGrid(photos) {
    const grid = document.getElementById('photo-grid');
    const countBar = document.getElementById('count-bar');
    countBar.textContent = `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
 
    if (!photos.length) {
      grid.innerHTML = '<div class="empty"><div class="icon">🌱</div><p>No photos here yet</p></div>';
      return;
    }
 
    grid.innerHTML = photos.map((p, i) => {
      const imgSrc = `/uploads/${p.plant_name.replace(/ /g, '_')}/${p.stored_filename}`;
      const date = p.date_taken
        ? new Date(p.date_taken + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : 'Unknown date';
 
      return `
        <div class="photo-card" onclick="openLightbox(${i})">
          <img src="${imgSrc}" alt="${p.plant_name}" loading="lazy"
               onerror="this.style.background='#EAF3DE';this.style.height='160px'">
          <div class="info">
            <div class="date">${date}</div>
            <div class="plant-name">${p.plant_name}</div>
          </div>
        </div>
      `;
    }).join('');
  }
 
  // ── Lightbox ──────────────────────────────────────────────────────────────
  function openLightbox(index) {
    currentIndex = index;
    showPhoto(index);
    document.getElementById('lightbox').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
 
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
    document.body.style.overflow = '';
  }
 
  function showPhoto(index) {
    const p = filtered[index];
    const imgSrc = `/uploads/${p.plant_name.replace(/ /g, '_')}/${p.stored_filename}`;
    const date = p.date_taken
      ? new Date(p.date_taken + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      : 'Unknown date';
 
    document.getElementById('lb-img').src = imgSrc;
    document.getElementById('lb-date').textContent = date;
    document.getElementById('lb-plant').textContent = p.plant_name;
 
    const dlBtn = document.getElementById('lb-download');
    dlBtn.href = imgSrc;
    dlBtn.download = p.stored_filename;
 
    const hint = document.getElementById('save-hint');
    if (isIOS) {
      hint.textContent = 'Tap & hold the photo above to save to Photos';
    } else if (isAndroid) {
      hint.textContent = 'Saves to Downloads — opens in Google Photos';
    } else {
      hint.textContent = '';
    }
  }
 
  function navigatePhoto(dir) {
    currentIndex = (currentIndex + dir + filtered.length) % filtered.length;
    showPhoto(currentIndex);
  }
 
  // Close lightbox on backdrop tap
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
 
  // Swipe support
  let touchStartX = 0;
  document.getElementById('lightbox').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  });
  document.getElementById('lightbox').addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) navigatePhoto(diff > 0 ? 1 : -1);
  });
 
  init();
</script>
</body>
</html>
